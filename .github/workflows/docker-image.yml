name: Docker Image CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14, 16, 18]  # Puedes agregar más versiones de Node.js o diferentes configuraciones

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}  # Usa la versión de Node.js definida en la matriz

    - name: Echo Build the Docker image
      run: echo docker build . --file Dockerfile --tag my-image-name:${{ matrix.node-version }}-$(date +%s)
